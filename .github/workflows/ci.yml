name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    name: Mobile — typecheck, lint, Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  backend:
    name: Backend — lint, unit, e2e (Supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopai-backend
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shopai-backend/package-lock.json
      - run: npm ci
      - run: npx eslint "src/**/*.ts" "test/**/*.ts"
      - run: npm run build
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci --runInBand
