name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    name: Mobile — typecheck, lint, Jest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      # Chỉ tải báo cáo coverage lên một lần, tránh trùng giữa các phiên bản Node
      - name: Lưu báo cáo coverage
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mobile
          path: coverage/
          retention-days: 14

  backend-test:
    name: Backend — lint, build, unit, e2e (Supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopai-backend
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shopai-backend/package-lock.json
      - run: npm ci
      - run: npx eslint "src/**/*.ts" "test/**/*.ts"
      - run: npm run build
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci --runInBand
